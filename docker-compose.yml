services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile

    working_dir: /workspace

    volumes:
      - resume_workspace:/workspace

    read_only: true

    tmpfs:
      - /tmp

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    stdin_open: true
    tty: true

volumes:
  resume_workspace:
